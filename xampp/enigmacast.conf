# Serve C:/xampp/htdocs/enigmacast as files.
# No VirtualHost here: an extra vhost would become the default site and
# would hide the CodeIgniter app that already owns localhost.

Alias /enigmacast "C:/xampp/htdocs/enigmacast"

<Directory "C:/xampp/htdocs/enigmacast">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php index.htm
</Directory>
