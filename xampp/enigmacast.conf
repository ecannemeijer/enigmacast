# EnigmaCast-vhost-begin
# First VirtualHost is the default site. localhost must stay on htdocs,
# otherwise http://localhost/enigmacast/install.php never reaches that folder.
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "C:/xampp/htdocs/enigmacast">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
        DirectoryIndex install.php index.php index.html
    </Directory>
</VirtualHost>
# EnigmaCast-vhost-end
