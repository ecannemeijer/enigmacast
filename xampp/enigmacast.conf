# EnigmaCast-vhost-begin
<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot "C:/xampp/htdocs/enigmacast"
    <Directory "C:/xampp/htdocs/enigmacast">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
        DirectoryIndex install.php index.php index.html
    </Directory>
    ErrorLog "logs/enigmacast-error.log"
    CustomLog "logs/enigmacast-access.log" common
</VirtualHost>
# EnigmaCast-vhost-end
