# EnigmaCast on XAMPP.
# Included from httpd.conf. The first VirtualHost becomes the default
# for port 80, so localhost must stay pointed at the whole htdocs tree.
# enigmacast.local then serves only C:/xampp/htdocs/enigmacast.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/error.log"
    CustomLog "logs/access.log" combined
</VirtualHost>

<VirtualHost *:80>
    ServerName enigmacast.local
    DocumentRoot "C:/xampp/htdocs/enigmacast"
    <Directory "C:/xampp/htdocs/enigmacast">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php index.htm
    </Directory>
    ErrorLog "logs/enigmacast-error.log"
    CustomLog "logs/enigmacast-access.log" combined
</VirtualHost>
